name: Deploy to AWS

# workflow_dispatch is kept alongside the push trigger — it redeploys the
# current main without needing a commit.
on:
  push:
    branches: [main]
    # Skip pushes that cannot change what is published. Each of these would
    # otherwise rebuild, run two `s3 sync --delete` passes, and invalidate the
    # whole distribution to produce a byte-identical site.
    #
    # Scoped to root-level markdown on purpose. `**/*.md` would look equivalent
    # and would silently stop publishing blog posts, which live in
    # src/content/blog/*.md. GitHub's `*` does not match `/`, so `*.md` reaches
    # README.md and CLAUDE.md and nothing under src/.
    #
    # A push touching one of these AND a real file still deploys — the run is
    # skipped only when every changed path matches.
    paths-ignore:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Not `production` — that environment carries a required reviewer, and
    # gating content behind a manual approval on every push is what this change
    # exists to remove. This one is pinned to main but runs unattended.
    #
    # The separation is also what keeps this job's IAM role narrow: each
    # environment maps to exactly one role, so a content deploy cannot assume
    # the one that can rewrite infrastructure. See terraform/github_oidc.tf.
    environment: production-content
    steps:
      - uses: actions/checkout@v7

      # .nvmrc is the single source of truth, so local and CI cannot drift.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Two passes, because the right cache header differs by file type.
      #
      # Astro fingerprints everything under _astro/ (app.Dg2VxUYT.css), so those
      # are safe to cache forever — a change produces a new filename. HTML keeps
      # the same URL across deploys, so it must revalidate or visitors keep
      # seeing stale pages pointing at deleted asset names.
      - name: Sync fingerprinted assets
        run: |
          aws s3 sync dist/ "s3://${{ vars.AWS_SITE_BUCKET }}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" --exclude "*.xml" --exclude "*.txt"

      # --delete is required on BOTH passes. Each pass only considers the files
      # its filters select, so a pass that excludes *.html will not delete stale
      # *.html at the destination. Without this, removed pages stay live
      # forever — the first deploy left five pages from a 2017 Gatsby site
      # serving 200s.
      - name: Sync HTML and text assets
        run: |
          aws s3 sync dist/ "s3://${{ vars.AWS_SITE_BUCKET }}/" \
            --delete \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" \
            --include "*.html" --include "*.xml" --include "*.txt"

      # "/*" counts as a single path, so this stays inside the 1,000
      # free invalidation paths per month.
      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_DISTRIBUTION_ID }}" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID created"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.AWS_DISTRIBUTION_ID }}" --id "$ID"

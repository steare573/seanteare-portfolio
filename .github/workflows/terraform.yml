name: Terraform

on:
  pull_request:
    paths: ['terraform/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['terraform/**', '.github/workflows/terraform.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC

defaults:
  run:
    working-directory: terraform

jobs:
  # Runs on PRs with NO credentials of any kind. The OIDC trust policy accepts
  # only the environment form of the subject claim, and this job declares no
  # environment, so it cannot assume a role — by design. Formatting and schema
  # validation still catch most mistakes before merge.
  #
  # Both roots are validated here. terraform/github/ is applied by hand rather
  # than by CI, which is exactly why it needs a check that runs automatically.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.8'

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Validate the AWS root
        run: |
          terraform init -backend=false
          terraform validate

      # `validate` never contacts an API, so this needs no GitHub credential.
      - name: Validate the GitHub root
        working-directory: terraform/github
        run: |
          terraform init -backend=false
          terraform validate

  plan_apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # This environment carries the required-reviewer rule, so an apply waits for
    # approval. The rule is created in terraform/github/, not here. The site
    # deploy runs in a different, unreviewed environment; the two are not
    # interchangeable, and each maps to a different IAM role.
    environment: production
    #
    # This job applies the AWS root only. terraform/github/ manages repo
    # settings — environments, protection rules, branch protection — and is
    # applied from a workstation on purpose: a repo-admin credential here could
    # be used to switch off the very rules gating this pipeline.
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.8'

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - run: terraform init

      - name: Plan
        id: plan
        run: terraform plan -input=false -out=tfplan

      # Applies the saved plan, so what was reviewed is exactly what runs.
      - name: Apply
        if: github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan
